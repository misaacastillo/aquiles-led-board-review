name: KiCad review

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  reports:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Generate DRC and ERC reports with KiCad 9.0.9
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e KICAD_CONFIG_HOME=/tmp/kicad-review-config \
            -v "$PWD:/workspace" -w /workspace --entrypoint /bin/sh \
            kicad/kicad:9.0.9@sha256:e638b79b0321f29395a5b783e94bb9f3c73303e8da15da27b8f5cb4b67a37729 \
            -ec '
              config="$KICAD_CONFIG_HOME/9.0"
              mkdir -p "$config"
              cp /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table "$config/"
              ./scripts/check.sh
            '
          python3 scripts/summarize.py | tee reports/summary.txt
      - name: Save the review reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aquiles-led-kicad-reports
          path: reports/
          if-no-files-found: error
